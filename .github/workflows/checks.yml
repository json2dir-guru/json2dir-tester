name: Benchmark checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - run: python3 -m unittest discover -s benchmarks -v
      - run: dotnet build src/Json2dirTester -c Release --nologo
      - run: dotnet run --project tests/Benchmarks -c Release
