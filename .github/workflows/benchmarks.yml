name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      baseline_run:
        description: Prior benchmark run ID for incremental reuse (empty runs everything)
        default: ''
        type: string
      suite:
        description: Workload suite (standard has 8 workloads, extended has 26)
        default: standard
        type: choice
        options:
          - standard
          - extended
      filter:
        description: Optional workload substring (empty runs the selected suite)
        default: ''
        type: string
      timeout:
        description: Seconds per invocation (command deadline)
        default: '30'
        type: string
      budget:
        description: Seconds per implementation/workload/storage pair (excludes conformance)
        default: '240'
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: benchmarks
  cancel-in-progress: false

jobs:
  campaign:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CAMPAIGN: .bench/campaign
      BENCHMARK_SUITE: ${{ inputs.suite }}
      WORKLOAD_FILTER: ${{ inputs.filter }}
      BENCHMARK_TIMEOUT: ${{ inputs.timeout }}
      BENCHMARK_BUDGET: ${{ inputs.budget }}
      BASELINE_RUN: ${{ inputs.baseline_run }}
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Set campaign deadline
        run: echo "BENCHMARK_DEADLINE=$(( $(date +%s) + 345 * 60 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 10
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        timeout-minutes: 10
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        timeout-minutes: 10
        with:
          name: json2dirpkgs
          skipPush: true
      - name: Download locked packages and benchmark tools
        timeout-minutes: 30
        run: |
          python3 benchmarks/prepare_packages.py --dir "$CAMPAIGN"
          echo "$PWD/$CAMPAIGN/work/runtimes/tools/bin" >> "$GITHUB_PATH"
      - name: Download baseline results
        if: inputs.baseline_run != ''
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$BASELINE_RUN" =~ ^[0-9]+$ ]] || { echo "Invalid baseline run ID"; exit 1; }
          gh run download "$BASELINE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "json2dir-benchmark-$BASELINE_RUN" --dir .bench/baseline
      - name: Select added, changed and unfinished implementations
        run: |
          python3 benchmarks/bundle.py plan --campaign "$CAMPAIGN" --baseline .bench/baseline \
            --plan .bench/plan.json --suite "$BENCHMARK_SUITE" --filter "$WORKLOAD_FILTER" \
            --timeout "$BENCHMARK_TIMEOUT" --budget "$BENCHMARK_BUDGET"
          python3 -c 'import json; print("BENCHMARK_METHODOLOGY_SHA256=" + json.load(open(".bench/plan.json"))["methodologySha256"])' >> "$GITHUB_ENV"
      - name: Check runner and fixtures
        timeout-minutes: 10
        run: |
          python3 -m unittest discover -s benchmarks -v
          dotnet run --project tests/Benchmarks -c Release
          dotnet build src/Json2dirTester -c Release --nologo
      - name: Run sequential campaign
        timeout-minutes: 345
        run: |
          mapfile -t names < <(python3 -c 'import json; print("\n".join(json.load(open(".bench/plan.json"))["runNames"]))')
          if [[ ${#names[@]} -eq 0 || -z "${names[0]}" ]]; then
            echo "All requested results are reusable; no measurements needed"
            exit 0
          fi
          remaining=$(( BENCHMARK_DEADLINE - $(date +%s) ))
          if (( remaining <= 0 )); then
            echo "Campaign deadline already reached"
            exit 2
          fi
          # The runner saves on cancellation; this guard also bounds blocked cleanup.
          timeout --kill-after=30s "$(( remaining + 30 ))s" \
            dotnet src/Json2dirTester/bin/Release/net10.0/json2dir-tester.dll bench "${names[@]}" \
            --dir "$CAMPAIGN" --suite "$BENCHMARK_SUITE" --filter "$WORKLOAD_FILTER" \
            --timeout "$BENCHMARK_TIMEOUT" --budget "$BENCHMARK_BUDGET" --max-duration "$remaining"
      - name: Export and bundle measurements
        if: always()
        timeout-minutes: 5
        run: |
          if [[ -f "$CAMPAIGN/campaign.json" && -f "$CAMPAIGN/samples.json" ]]; then
            dotnet src/Json2dirTester/bin/Release/net10.0/json2dir-tester.dll bench-export --dir "$CAMPAIGN" --out .bench/export
          fi
          if [[ -f .bench/plan.json ]]; then
            python3 benchmarks/bundle.py merge --campaign "$CAMPAIGN" --baseline .bench/baseline \
              --plan .bench/plan.json --out .bench/bundle
          fi
      - name: Upload campaign and publication data
        if: always()
        timeout-minutes: 8
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: json2dir-benchmark-${{ github.run_id }}
          include-hidden-files: true
          retention-days: 90
          path: |
            .bench/campaign/lock.json
            .bench/campaign/campaign.json
            .bench/campaign/samples.json
            .bench/export/
            .bench/bundle/
            .bench/plan.json
